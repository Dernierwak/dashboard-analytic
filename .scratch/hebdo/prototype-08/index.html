<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page hebdo — maquette</title>
<!--
  PROTOTYPE, jetable — ticket 08 « La page entière, en maquette ».
  Trois propositions tirées de la variante D (retours de David, 2026-10-31),
  ?variant=D1|D2|D3, flèches ← → pour passer. Elles ne diffèrent que par la
  forme des totaux et par le panneau de la semaine, à droite de la frise.
  Les chiffres viennent de donnees.local.js (ignoré par git, dépôt public),
  recréé par `python3.12 -I extraire.py <.env du worker> <début du user_id>`.
-->
<style>
  :root {
    --fond: #f7f7f5; --carte: #fff; --encre: #1c1c1a; --doux: #6b6b66; --trait: #e8e7e3;
    --mieux: #e3f2e8; --mieux-encre: #1f6b3a; --moins: #fbe7e5; --moins-encre: #9a2f25; --neutre: #efeeea;
    --meta: #4a6cf7; --google: #e3a008; --insta: #c13584;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fond); color: var(--encre);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; }
  .num { font-variant-numeric: tabular-nums; }
  .doux { color: var(--doux); }
  .petit { font-size: 12.5px; }
  h1 { font-size: 26px; letter-spacing: -.02em; margin: 0; font-weight: 650; }
  h2 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--doux); font-weight: 600; margin: 0 0 12px; }
  .bloc { background: var(--carte); border: 1px solid var(--trait); border-radius: 14px; padding: 20px; min-width: 0; }
  .etat { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 11px; white-space: nowrap; }
  .etat.mieux { background: var(--mieux); color: var(--mieux-encre); }
  .etat.moins { background: var(--moins); color: var(--moins-encre); }
  .etat.dans { background: var(--neutre); color: var(--doux); }
  details > summary { cursor: pointer; list-style: none; }
  details > summary::before { content: "▸ "; color: var(--doux); }
  details[open] > summary::before { content: "▾ "; }
  .chg { border-left: 2px solid var(--trait); padding: 4px 10px; margin: 6px 0 6px 14px; }
  .pastille { border: 1px solid var(--trait); background: var(--carte); border-radius: 99px; padding: 3px 11px; font-size: 12.5px; cursor: pointer; color: var(--doux); }
  .pastille.on { background: var(--encre); color: #fff; border-color: var(--encre); }
  .rond { width: 30px; height: 30px; border-radius: 99px; border: 1px solid var(--trait); background: var(--carte); cursor: pointer; flex: none; }
  .rond:disabled { opacity: .35; cursor: default; }
  .note { max-width: 1240px; margin: 36px auto 90px; padding: 0 16px; font-size: 12.5px; color: var(--doux); }

  .haut { display: grid; grid-template-columns: minmax(0,2fr) minmax(0,1fr); gap: 16px; }
  .rail { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 2px 2px 10px; scrollbar-width: thin; }
  .rail > * { scroll-snap-align: start; flex: 0 0 90%; }

  .fait { display: grid; grid-template-columns: minmax(0,1fr) 400px; gap: 16px; align-items: start; }
  .frise { position: relative; overflow: auto; max-height: 640px; border-radius: 14px; background: var(--carte); border: 1px solid var(--trait); cursor: pointer; }
  .toile { position: relative; }
  .barre { position: absolute; height: 20px; border-radius: 99px; display: flex; align-items: center; font-size: 12px; white-space: nowrap; }
  .barre .av { position: absolute; inset: 0 auto 0 0; border-radius: 99px; }
  .barre .lib { position: sticky; left: 4px; z-index: 1; display: flex; align-items: center; gap: 5px; padding: 0 8px 0 3px; }
  .barre img { width: 16px; height: 16px; border-radius: 99px; object-fit: cover; }
  .pt { position: absolute; width: 8px; height: 8px; border-radius: 2px; background: var(--insta); opacity: .75; }
  .panneau { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
  .entete-sem { display: flex; align-items: center; gap: 8px; justify-content: space-between; margin-bottom: 14px; }
  .entete-sem strong { font-size: 16px; }
  .badge { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.55); color: #fff; font-size: 11px; border-radius: 99px; padding: 2px 8px; backdrop-filter: blur(4px); }
  .survol { position: relative; }
  .survol .dep { position: absolute; right: 8px; bottom: 8px; background: var(--encre); color: #fff; font-size: 11.5px; border-radius: 99px; padding: 2px 9px; opacity: 0; transition: opacity .15s; }
  .survol:hover .dep { opacity: 1; }
  .clamp { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
  img.cover { width: 100%; height: 100%; object-fit: cover; display: block; }

  #commutateur { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 99;
                 background: #111; color: #fff; border-radius: 99px; padding: 6px 8px; display: flex; gap: 8px; align-items: center;
                 box-shadow: 0 6px 24px rgba(0,0,0,.25); font-size: 13px; }
  #commutateur button { background: #333; color: #fff; border: 0; border-radius: 99px; width: 30px; height: 30px; cursor: pointer; font-size: 15px; }
  #commutateur span { padding: 0 6px; min-width: 210px; text-align: center; }
  @media (max-width: 900px) { .haut, .fait { grid-template-columns: 1fr; } .panneau { position: static; max-height: none; } }
</style>
</head>
<body>
<div id="page"></div>
<div class="note" id="note"></div>
<div id="commutateur">
  <button id="prec" aria-label="Proposition précédente">←</button><span id="libelle"></span><button id="suiv" aria-label="Proposition suivante">→</button>
</div>

<script src="donnees.local.js"></script>
<script>
const D = window.DONNEES;
if (!D) document.body.innerHTML = "<p style='padding:40px'>donnees.local.js manque — lancer extraire.py (voir l'en-tête du fichier).</p>";

// ── Formats ──────────────────────────────────────────────────────────────
const nf = (n, d = 0) => n == null ? "—" : n.toLocaleString("fr-CH", { minimumFractionDigits: d, maximumFractionDigits: d });
const chf = (n, d = 0) => n == null ? "—" : `${nf(n, d)} CHF`;
const JOURS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const dte = s => new Date(s + "T12:00:00");
const iso = d => d.toISOString().slice(0, 10);
const jourLong = s => { const d = dte(s); return `${JOURS[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()]}`; };
const court = s => { const d = dte(s); return `${d.getDate()} ${MOIS[d.getMonth()].slice(0, 4).replace(/\.?$/, "")}.`; };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtType = t => ({ CAROUSEL_ALBUM: "Carrousel", VIDEO: "Vidéo", IMAGE: "Image" }[t] || t);
const COUL = { "Meta": "#4a6cf7", "Google Ads": "#e3a008", "Instagram": "#c13584" };
const CLAIR = { "Meta": "#e4e9fe", "Google Ads": "#fcefc8" };

const S = D.semaine, T = D.totaux, AJD = D.aujourdhui;
const titre = (() => {
  const a = dte(S.debut), b = dte(S.fin);
  return `Semaine du ${a.getDate()}${a.getMonth() === b.getMonth() ? "" : " " + MOIS[a.getMonth()]} au ${b.getDate()} ${MOIS[b.getMonth()]}`;
})();
const somme = o => { const v = Object.values(o).filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) : null; };
const part = (v, t) => v != null && t ? `${Math.round(v / t * 100)} %` : "";
const raisonPortee = "La portée du compte par semaine n'est pas récoltée — seule celle de chaque post l'est, et des portées de posts ne s'additionnent pas.";
const portee = `<span class="doux petit">Portée organique</span> ${Object.keys(T.portee).map(k => `<span class="petit">${k} <strong>—</strong></span>`).join(" ")} <span class="doux petit" title="${raisonPortee}">ⓘ</span>`;

// ── Les canaux : ratios face à la semaine type (ticket 03) ───────────────
const RATIOS = [
  { cle: "ctr", nom: "CTR", fmt: v => `${nf(v, 2)} %`, mieux: "haut" },
  { cle: "cpc", nom: "CPC", fmt: v => chf(v, v < 0.1 ? 3 : 2), mieux: "bas" },
  { cle: "cpm", nom: "CPM", fmt: v => chf(v, 2), mieux: "bas" },
];
function lireRatio(cn, r) {
  const v = cn.repond ? cn.ratios[r.cle] : null, ref = cn.reference[r.cle];
  if (v == null || ref.med == null) return { v, ref, etat: null, mot: v == null ? "pas de ratio cette semaine" : `trop peu d'historique (${ref.n} semaines sur 6)` };
  const pos = v > ref.q3 ? "au-dessus" : v < ref.q1 ? "en dessous" : "dans";
  const bon = pos === "dans" ? "dans" : ((pos === "au-dessus") === (r.mieux === "haut") ? "mieux" : "moins");
  return { v, ref, etat: bon, mot: pos === "dans" ? "habituel" : pos };
}
// La moustache : de la moins bonne à la meilleure semaine de la fenêtre ; la
// boîte = « tes habitudes » (écart interquartile) ; le trait = la semaine
// type ; le point = la semaine regardée.
function moustache(r, l) {
  if (l.etat == null) return `<div class="doux petit">${l.mot}</div>`;
  const s = l.ref.semaines, lo = Math.min(...s, l.v), hi = Math.max(...s, l.v), w = 260;
  const x = v => 8 + (v - lo) / (hi - lo || 1) * (w - 16);
  const mn = Math.min(...s), mx = Math.max(...s), [meil, pire] = r.mieux === "haut" ? [mx, mn] : [mn, mx];
  const coul = { mieux: "var(--mieux-encre)", moins: "var(--moins-encre)", dans: "#444" }[l.etat];
  return `<svg width="100%" viewBox="0 0 ${w} 40" style="max-width:${w}px;display:block" aria-hidden="true">
    <line x1="${x(mn)}" x2="${x(mx)}" y1="14" y2="14" stroke="#bbb"/>
    <line x1="${x(mn)}" x2="${x(mn)}" y1="8" y2="20" stroke="#bbb"/><line x1="${x(mx)}" x2="${x(mx)}" y1="8" y2="20" stroke="#bbb"/>
    <rect x="${x(l.ref.q1)}" y="6" width="${Math.max(2, x(l.ref.q3) - x(l.ref.q1))}" height="16" rx="3" fill="#eeede9" stroke="#d5d4cf"/>
    <line x1="${x(l.ref.med)}" x2="${x(l.ref.med)}" y1="6" y2="22" stroke="#777" stroke-width="2"/>
    <circle cx="${x(l.v)}" cy="14" r="5.5" fill="${coul}" stroke="#fff" stroke-width="2"/>
    <text x="${x(meil)}" y="36" font-size="9.5" fill="#6b6b66" text-anchor="${meil === mx ? "end" : "start"}">meilleure ${r.fmt(meil)}</text>
    <text x="${x(pire)}" y="36" font-size="9.5" fill="#6b6b66" text-anchor="${pire === mx ? "end" : "start"}">moins bonne ${r.fmt(pire)}</text></svg>`;
}
// La moustache, grande (version E) : un axe avec ses deux bouts nommés, les
// 12 semaines en petits points pour voir où elles se tassent, la boîte
// « tes habitudes », la semaine type nommée au-dessus, la semaine en gros point.
function moustacheE(r, l) {
  if (l.etat == null) return `<div class="doux petit">${l.mot}</div>`;
  const s = l.ref.semaines, w = 460, mn = Math.min(...s), mx = Math.max(...s);
  const lo = Math.min(mn, l.v), hi = Math.max(mx, l.v), pad = (hi - lo) * .06 || 1;
  // Le « mieux » toujours à droite : un CPC plus bas se lit vers la droite.
  const x = v => { const t = (v - (lo - pad)) / (hi - lo + 2 * pad); return 14 + (r.mieux === "haut" ? t : 1 - t) * (w - 28); };
  const coul = { mieux: "var(--mieux-encre)", moins: "var(--moins-encre)", dans: "#333" }[l.etat];
  const [pire, meil] = r.mieux === "haut" ? [mn, mx] : [mx, mn];
  return `<svg width="100%" viewBox="0 0 ${w} 62" style="display:block" aria-hidden="true">
    <text x="${x(l.ref.med)}" y="11" font-size="10.5" fill="#6b6b66" text-anchor="middle">semaine type ${r.fmt(l.ref.med)}</text>
    <line x1="${x(pire)}" x2="${x(meil)}" y1="32" y2="32" stroke="#cfcec9" stroke-width="1.5"/>
    <rect x="${Math.min(x(l.ref.q1), x(l.ref.q3))}" y="21" width="${Math.max(3, Math.abs(x(l.ref.q3) - x(l.ref.q1)))}" height="22" rx="6" fill="#f0efeb"/>
    ${s.map(v => `<circle cx="${x(v)}" cy="32" r="2.6" fill="#a9a8a2"/>`).join("")}
    <line x1="${x(l.ref.med)}" x2="${x(l.ref.med)}" y1="16" y2="46" stroke="#6b6b66" stroke-width="2" stroke-linecap="round"/>
    <circle cx="${x(l.v)}" cy="32" r="7.5" fill="${coul}" stroke="#fff" stroke-width="2.5"/>
    <text x="${x(pire)}" y="59" font-size="10" fill="#8a8984" text-anchor="start">moins bonne ${r.fmt(pire)}</text>
    <text x="${x(meil)}" y="59" font-size="10" fill="#8a8984" text-anchor="end">meilleure ${r.fmt(meil)} →</text></svg>`;
}

// Les changements d'un canal, par catégorie (ticket 05, regroupement revu
// par David le 2026-10-31) : une ligne dépliable par catégorie.
function changementsCanal(plateforme) {
  const C = D.changements.filter(c => c.plateforme === plateforme), parCat = {};
  for (const c of C) (parCat[c.cat] ??= []).push(c);
  return `<div style="display:flex;justify-content:space-between;align-items:baseline"><h2 style="margin:0">Changements · ${C.length}</h2>
      <span class="petit doux" style="text-decoration:underline" title="Mène au journal ${plateforme}, ouvert sur la même semaine">journal →</span></div>
    ${C.length ? Object.entries(parCat).sort((a, b) => b[1].length - a[1].length).map(([cat, cs]) => `<details style="margin-top:10px;border-top:1px solid var(--trait);padding-top:8px">
      <summary><strong>${CAT[cat] || cat}</strong> <span class="doux">· ${cs.length}</span></summary>
      ${cs.map(c => `<div class="chg"><div class="doux petit">${cap(jourLong(c.quand.slice(0, 10)))} · ${esc(c.cid ? c.campagne : "hors campagne")}</div><div class="petit">${esc(c.resume)}</div></div>`).join("")}</details>`).join("")
      : `<p class="doux petit">Aucun changement écrit par ${plateforme} cette semaine.</p>`}`;
}

function carteCanalE(nom, cn, note) {
  const n = Math.max(...RATIOS.map(r => cn.reference[r.cle].n));
  return `<div class="bloc" style="border-top:3px solid ${COUL[nom]};padding:22px 24px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:14px">
      <a href="#" title="Mène à la page ${nom}"><strong style="font-size:18px">${nom}</strong> <span class="doux">→</span></a><span class="doux petit">${note || ""}</span></div>
    <div style="display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:32px">
      <div>
        <div style="display:flex;gap:36px;margin-bottom:10px" class="num">
          ${[["Dépense", chf(cn.repond ? cn.depense : null)], ["Impressions", nf(cn.repond ? cn.impressions : null)], ["Clics", nf(cn.repond ? cn.clics : null)]]
            .map(([k, v]) => `<div><div class="doux petit">${k}</div><div style="font-size:22px;font-weight:600">${v}</div></div>`).join("")}
        </div>
        ${RATIOS.map(r => { const l = lireRatio(cn, r); return `<div style="display:grid;grid-template-columns:110px minmax(0,1fr);gap:18px;align-items:center;padding:10px 0 4px;border-top:1px solid var(--trait)" class="num">
          <div><div class="doux petit">${r.nom}</div><div style="font-size:20px;font-weight:600">${l.v == null ? "—" : r.fmt(l.v)}</div>${l.etat ? `<span class="etat ${l.etat}">${l.mot}</span>` : ""}</div>
          <div>${moustacheE(r, l)}</div></div>`; }).join("")}
        <div class="doux petit" style="margin-top:8px">Comparé à ta semaine type — la médiane de tes ${n} dernières semaines. Le mieux est toujours à droite.</div>
      </div>
      <div style="border-left:1px solid var(--trait);padding-left:24px">${changementsCanal(nom)}</div>
    </div></div>`;
}

function carteCanal(nom, cn, note) {
  const n = Math.max(...RATIOS.map(r => cn.reference[r.cle].n));
  return `<a href="#" class="bloc" style="display:block;border-top:3px solid ${COUL[nom]}" title="Mène à la page ${nom}">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><strong style="font-size:16px">${nom}</strong><span class="doux petit">${note || ""}</span></div>
    <div style="display:flex;gap:26px;margin:12px 0 4px" class="num">
      ${[["Dépense", chf(cn.repond ? cn.depense : null)], ["Impressions", nf(cn.repond ? cn.impressions : null)], ["Clics", nf(cn.repond ? cn.clics : null)]]
        .map(([k, v]) => `<div><div class="doux petit">${k}</div><div style="font-size:19px">${v}</div></div>`).join("")}
    </div>
    ${RATIOS.map(r => { const l = lireRatio(cn, r); return `<div style="display:grid;grid-template-columns:52px 96px minmax(0,1fr);gap:10px;align-items:center;padding:8px 0 2px;border-top:1px solid var(--trait)" class="num">
      <strong>${r.nom}</strong>
      <div><div style="font-size:16px">${l.v == null ? "—" : r.fmt(l.v)}</div>${l.etat ? `<span class="etat ${l.etat}">${l.mot}</span>` : ""}</div>
      <div>${moustache(r, l)}</div></div>`; }).join("")}
    <div class="doux petit" style="margin-top:8px">Comparé à ta semaine type — la médiane de tes ${n} dernières semaines.</div></a>`;
}
const canaux = () => `<section style="margin-top:26px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h2 style="margin:0">Les canaux</h2>
      <div style="display:flex;gap:6px"><button class="rond" data-rail="-1" aria-label="Canal précédent">‹</button><button class="rond" data-rail="1" aria-label="Canal suivant">›</button></div></div>
    <div class="rail" id="rail">${carteCanal("Meta", D.meta)}${carteCanal("Google Ads", D.google, "aperçu — pas encore au module")}</div></section>`;

// ── Changements (ticket 05) ──────────────────────────────────────────────
const CAT = { budget: "Budget", enchere: "Enchère", audience: "Audience", creatif: "Créatif", objectif: "Objectif",
              motcle: "Mot-clé", diffusion: "Diffusion", calendrier: "Calendrier", autre: "Réglage" };
function changements() {
  const C = D.changements.filter(c => c.plateforme === "Meta"), parJour = {};
  for (const c of C) (parJour[c.quand.slice(0, 10)] ??= []).push(c);
  return `<aside class="bloc" style="max-height:340px;overflow:auto"><h2>Les changements</h2>
    <a href="#" style="text-decoration:underline" title="Mène au journal Meta, ouvert sur la même semaine">Meta · ${C.length} changement${C.length > 1 ? "s" : ""} →</a>
    ${Object.keys(parJour).sort().reverse().map(j => {
      const parCamp = {};
      for (const c of parJour[j]) (parCamp[c.cid || "—"] ??= []).push(c);
      return `<div style="margin-top:12px"><div style="font-weight:600">${cap(jourLong(j))} · ${parJour[j].length}</div>
        ${Object.values(parCamp).map(cs => `<details style="margin:4px 0 0 4px"><summary>${esc(cs[0].cid ? cs[0].campagne : "Hors campagne")} <span class="doux">— Meta · ${cs.length}</span></summary>
          ${cs.map(c => `<div class="chg"><span class="etat dans">${CAT[c.cat] || c.cat}</span> <span class="doux petit">${c.quand.slice(11, 16)} UTC</span><div class="petit">${esc(c.resume)}</div></div>`).join("")}</details>`).join("")}</div>`;
    }).join("")}</aside>`;
}

// ── Campagnes : statut et semaine ────────────────────────────────────────
function statut(c) {
  if (c.fin && c.fin_declaree && c.fin < AJD) return "terminée";
  if (c.debut > AJD) return "prévue";
  if (c.statut === "PAUSED") return "en pause";
  // Sans fin déclarée, la dernière dépense n'est pas une fin : la récolte
  // s'arrête au jour d'avant, la campagne continue.
  if (c.statut === "ACTIVE" || c.statut === "ENABLED") return "en cours";
  if (c.statut === "WITH_ISSUES") return "signalée par Meta";
  return null;
}
const ouverte = c => !c.fin_declaree && statut(c) === "en cours";
const an = +S.fin.slice(0, 4), Y0 = new Date(`${an}-01-01T12:00:00`), NJ = 365;
const jIdx = s => Math.round((dte(s) - Y0) / 864e5);
const bornes = w => { const f = dte(S.fin); f.setDate(f.getDate() - 7 * w); const d = new Date(f); d.setDate(d.getDate() - 6); return [iso(d), iso(f)]; };
const semDe = s => Math.floor((dte(S.fin) - dte(s)) / 864e5 / 7);
const W_MAX = semDe(`${an}-01-01`);
const postsDe = w => { const [a, b] = bornes(w); return D.posts.filter(p => p.date >= a && p.date <= b).sort((x, z) => z.date.localeCompare(x.date)); };
const campsDe = w => { const [a, b] = bornes(w);
  return D.campagnes.filter(c => c.debut <= b && (ouverte(c) || (c.fin && c.fin >= a)))
    .sort((x, z) => (x.plateforme === z.plateforme ? 0 : x.plateforme === "Meta" ? -1 : 1) || (z.sem[w] || 0) - (x.sem[w] || 0)); };
const depSem = (c, w) => c.sem[w] != null ? `${chf(c.sem[w])} cette semaine` : "rien dépensé cette semaine";
const marque = (c, w) => { const [a, b] = bornes(w);
  if (c.debut >= a && c.debut <= b) return `<span class="etat mieux">lancée</span>`;
  if (c.fin_declaree && c.fin >= a && c.fin <= b) return `<span class="etat dans">terminée</span>`;
  return ""; };
const dates = c => `${court(c.debut)} → ${c.fin_declaree ? court(c.fin) : "sans fin"}`;

// ── La frise (sert de navigateur) ────────────────────────────────────────
function frise(etat, rafraichir) {
  const vue = document.getElementById("frise"), toile = document.getElementById("toile");
  const s = etat.zoom === "Année" ? (vue.clientWidth - 2) / NJ : 20, X = j => j * s;
  const [a, b] = bornes(etat.w);
  let h = "";
  for (let m = 0; m < 12; m++) {
    const j = jIdx(`${an}-${String(m + 1).padStart(2, "0")}-01`), j2 = m < 11 ? jIdx(`${an}-${String(m + 2).padStart(2, "0")}-01`) : NJ;
    h += `<div style="position:absolute;top:0;bottom:0;left:${X(j)}px;width:${X(j2) - X(j)}px;background:${m % 2 ? "#fafaf8" : "transparent"}"></div>
          <div style="position:absolute;top:7px;left:${X(j) + 6}px;font-size:11px;color:var(--doux)">${etat.zoom === "Année" ? MOIS[m].slice(0, 3) : MOIS[m]}</div>`;
  }
  h += `<div style="position:absolute;top:0;bottom:0;left:${X(jIdx(a))}px;width:${7 * s}px;background:rgba(74,108,247,.12);border-radius:4px;box-shadow:inset 0 0 0 1.5px rgba(74,108,247,.55)"></div>
        <div style="position:absolute;top:0;bottom:0;left:${X(jIdx(AJD))}px;border-left:1.5px dashed #c33"></div>`;
  let y = 30;
  const zone = (lib, coul) => { h += `<div class="zone" style="position:absolute;z-index:2;top:${y}px;left:${vue.scrollLeft + 8}px;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:${coul}">${lib}</div>`; y += 18; };
  zone("Posts Instagram", COUL.Instagram);
  const pile = {};
  for (const p of D.posts) { const j = jIdx(p.date), k = Math.floor(X(j) / 9); pile[k] = (pile[k] || 0) + 1;
    h += `<div class="pt" style="left:${X(j)}px;top:${y + (pile[k] - 1) * 10}px" title="${esc(jourLong(p.date) + " · " + fmtType(p.type))}"></div>`; }
  y += Math.max(1, ...Object.values(pile)) * 10 + 14;
  for (const p of ["Meta", "Google Ads"]) {
    zone(p, COUL[p]);
    // En zoom Mois, seulement ce qui vit autour de la semaine choisie (± 6
    // semaines) : sinon le mois se lit entre des rangées vides.
    const proche = c => { const [m0, m1] = [bornes(etat.w + 6)[0], bornes(Math.max(0, etat.w - 6))[1]];
      return c.debut <= m1 && (ouverte(c) || (c.fin && c.fin >= m0)); };
    for (const c of D.campagnes.filter(c => c.plateforme === p && (etat.zoom === "Année" || proche(c))).sort((x, z) => x.debut.localeCompare(z.debut))) {
      const j0 = Math.max(0, jIdx(c.debut)), j1 = Math.min(NJ, ouverte(c) ? jIdx(AJD) : jIdx(c.fin || AJD));
      const av = Math.max(0, Math.min(1, (jIdx(AJD) - j0) / Math.max(1, j1 - j0)));
      const actif = c.debut <= b && (ouverte(c) || (c.fin && c.fin >= a));
      h += `<div class="barre" style="top:${y}px;left:${X(j0)}px;width:${Math.max(6, X(j1) - X(j0))}px;background:${CLAIR[p]};opacity:${actif ? 1 : .5};box-shadow:${actif ? `inset 0 0 0 1.5px ${COUL[p]}` : "none"}" title="${esc(c.nom + (statut(c) ? " · " + statut(c) : ""))}">
        <div class="av" style="width:${av * 100}%;background:${COUL[p]};opacity:.2"></div>
        <span class="lib">${c.visuels[0] ? `<img src="${c.visuels[0]}" alt="">` : `<span style="width:8px;height:8px;border-radius:99px;background:${COUL[p]};margin-left:4px"></span>`}${esc(c.nom)}</span></div>`;
      y += 24;
    }
    y += 8;
  }
  toile.style.width = `${X(NJ)}px`; toile.style.height = `${y}px`; toile.innerHTML = h;
  vue.onscroll = () => toile.querySelectorAll(".zone").forEach(z => z.style.left = `${vue.scrollLeft + 8}px`);
  toile.onclick = e => { const r = toile.getBoundingClientRect(), d = new Date(Y0); d.setDate(d.getDate() + Math.floor((e.clientX - r.left) / s)); etat.w = semDe(iso(d)); rafraichir(); };
  return s;
}

// La charpente commune : titre, haut (totaux + changements), canaux, puis
// « Ce qui a été fait » (frise | panneau). Seuls les totaux et le panneau changent.
function page(totaux, seul) {

const vignetteCamp = (c, taille) => c.visuels[0]

// ════════════════════════════════════════════════════════════════════════
// D2 — L'anneau : un anneau par total, la part de chaque canal autour ; à
// droite, deux onglets (Posts · Campagnes) en grille de deux colonnes.
// ════════════════════════════════════════════════════════════════════════
function anneau(o) {
  const t = somme(o); let a0 = -Math.PI / 2, arcs = "";
  for (const [k, v] of Object.entries(o)) { if (!v) continue;
    const a1 = a0 + v / t * 2 * Math.PI, gr = a1 - a0 > Math.PI ? 1 : 0, R = 30;
    arcs += `<path d="M ${36 + R * Math.cos(a0)} ${36 + R * Math.sin(a0)} A ${R} ${R} 0 ${gr} 1 ${36 + R * Math.cos(a1 - .04)} ${36 + R * Math.sin(a1 - .04)}" stroke="${COUL[k]}" stroke-width="9" fill="none" stroke-linecap="round"/>`;
    a0 = a1; }
  return `<svg width="72" height="72" aria-hidden="true">${arcs}</svg>`;
}
const D2 = {
  nom: "L'anneau", zoom: "Mois", onglet: "posts",
  totaux() {

    return `<section class="bloc"><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px">${bloc("Dépense de la semaine", T.depense, v => chf(v))}${bloc("Impressions de la semaine", T.impressions, v => nf(v))}</div>

  },
  panneau(w) {
    const posts = postsDe(w), camps = campsDe(w);
    const onglets = `<div style="display:flex;gap:6px;margin-bottom:12px">
      <button class="pastille ${this.onglet === "posts" ? "on" : ""}" data-onglet="posts">Posts · ${posts.length}</button>
      <button class="pastille ${this.onglet === "camps" ? "on" : ""}" data-onglet="camps">Campagnes · ${camps.length}</button></div>`;
    const corps = this.onglet === "posts"

        : `<p class="doux petit">Aucun post publié cette semaine.</p>`)
      : `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${camps.map(c => `<div class="survol" style="border:1px solid var(--trait);border-radius:10px;overflow:hidden">

          <span class="dep num">${depSem(c, w)}</span></div>`).join("")}</div>`;
    return entete(w) + onglets + corps;

        : `<p class="doux petit">Aucune campagne ${this.onglet} active cette semaine.</p>`;
    }
    return entete(w) + onglets + corps;
  },
};

// ── Commutateur ──────────────────────────────────────────────────────────
const VARIANTES = { E };
const NOTES = {
  E: "E — D2 corrigée : totaux en bandeau ; un canal par écran (le suivant dépasse à droite), ses changements dedans par catégorie, la moustache en grand avec les 12 semaines en points et le mieux toujours à droite ; à droite de la frise, la semaine en onglets Organique · Instagram et Campagnes · Meta / Google Ads.",
  D1: "D1 — totaux en chiffres seuls, la part de chaque canal en lignes ; à droite, les posts en grandes cartes, les campagnes en liste. Frise ouverte sur l'année.",
  D2: "D2 — un anneau par total ; à droite, deux onglets Posts · Campagnes en grille. Frise ouverte sur le mois.",
  D3: "D3 — les totaux en petit tableau canal × total ; à droite, la mosaïque des posts, les campagnes à visuels en bandeau, les autres en pastilles. Frise ouverte sur le mois.",
};
const cles = Object.keys(VARIANTES);
let courante = new URLSearchParams(location.search).get("variant");
if (!VARIANTES[courante]) courante = cles[0];
const etat = { w: 0, zoom: null };

function rendre() {
  const v = VARIANTES[courante];
  etat.zoom ??= v.zoom;
  document.getElementById("page").innerHTML = page(v.totaux(), v.seul);
  document.getElementById("commutateur").style.display = cles.length > 1 ? "flex" : "none";
  const rail = document.getElementById("rail");
  document.querySelectorAll("[data-rail]").forEach(b => b.onclick = () => rail.scrollBy({ left: +b.dataset.rail * rail.clientWidth * .8, behavior: "smooth" }));
  const vue = document.getElementById("frise"), panneau = document.getElementById("panneau");
  const rafraichir = (centrer) => {
    etat.w = Math.max(0, Math.min(W_MAX, etat.w));
    document.querySelectorAll("[data-zoom]").forEach(b => b.classList.toggle("on", b.dataset.zoom === etat.zoom));
    const s = frise(etat, () => rafraichir());
    if (centrer && etat.zoom === "Mois") vue.scrollLeft = Math.max(0, jIdx(bornes(etat.w)[0]) * s - vue.clientWidth / 2);
    panneau.innerHTML = v.panneau(etat.w);
  };
  document.querySelectorAll("[data-zoom]").forEach(b => b.onclick = () => { etat.zoom = b.dataset.zoom; rafraichir(true); });
  panneau.onclick = e => {
    const t = e.target.closest("[data-w],[data-w0],[data-onglet]"); if (!t) return; e.preventDefault();
    if (t.dataset.onglet) v.onglet = t.dataset.onglet;
    else etat.w = t.hasAttribute("data-w0") ? 0 : etat.w + +t.dataset.w;
    rafraichir(!t.dataset.onglet);
  };
  rafraichir(true);
  document.getElementById("libelle").textContent = `${courante} · ${v.nom}`;
  document.getElementById("note").innerHTML = `${NOTES[courante]}<br><br>Compte réel, extrait le ${jourLong(AJD)}. Jour de travail : ${D.jour_travail}. La carte Google est calculée sur ses vrais chiffres, mais Google n'est pas encore au module des canaux. Les changements portent l'heure UTC. Aucun signal ne dit encore si le journal Meta a couvert la semaine.`;
  const u = new URL(location); u.searchParams.set("variant", courante); history.replaceState(null, "", u);
}
const aller = d => { courante = cles[(cles.indexOf(courante) + d + cles.length) % cles.length]; etat.zoom = null; rendre(); };
document.getElementById("prec").onclick = () => aller(-1);
document.getElementById("suiv").onclick = () => aller(1);
addEventListener("keydown", e => {
  if (e.target.closest("input,textarea,[contenteditable]")) return;
  if (e.key === "ArrowLeft") aller(-1);
  if (e.key === "ArrowRight") aller(1);
});
addEventListener("resize", () => { clearTimeout(window._r); window._r = setTimeout(rendre, 200); });
if (D) rendre();
</script>
