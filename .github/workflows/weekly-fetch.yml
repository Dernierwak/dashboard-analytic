name: Fetch automatique des données

# Tourne chaque jour à 07:00 UTC. Le worker ne traite que les utilisateurs
# dont c'est le jour de mise à jour (profiles.fetch_schedule) — défaut : lundi.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:        # permet de lancer à la main depuis l'onglet Actions
    inputs:
      force:
        description: "Ignorer le jour planifié (fetch tous les users)"
        type: boolean
        default: false
      user_id:
        description: "Ne traiter que cet utilisateur (bouton « Mes données » de Pulse)"
        type: string
        default: ""
      label_only:
        description: "Labellisation IA seule + republication du rapport (bouton « Classer mes contenus »)"
        type: boolean
        default: false
      categorize_only:
        description: "Catégorisation IA des conversions GA4 seule (bouton « Classer mes conversions », page /conversions)"
        type: boolean
        default: false
      report_only:
        description: "Republie juste le rapport/conseils depuis les données en base (bouton « Recharger mes conseils »)"
        type: boolean
        default: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run fetch worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          # Optionnel : brief IA du rapport publié (fallback déterministe sinon)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optionnel : email hebdo via Resend (sans clé → dry-run, aucun envoi)
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          if [ "${{ inputs.report_only }}" = "true" ] && [ -n "${{ inputs.user_id }}" ]; then
            python saas/worker/fetch_all.py --report-only "${{ inputs.user_id }}"
          elif [ "${{ inputs.label_only }}" = "true" ] && [ -n "${{ inputs.user_id }}" ]; then
            python saas/worker/fetch_all.py --label-only "${{ inputs.user_id }}"
          elif [ "${{ inputs.categorize_only }}" = "true" ] && [ -n "${{ inputs.user_id }}" ]; then
            python saas/worker/fetch_all.py --categorize-only "${{ inputs.user_id }}"
          elif [ -n "${{ inputs.user_id }}" ]; then
            python saas/worker/fetch_all.py --user "${{ inputs.user_id }}"
          elif [ "${{ inputs.force }}" = "true" ]; then
            python saas/worker/fetch_all.py --force
          else
            python saas/worker/fetch_all.py
          fi
